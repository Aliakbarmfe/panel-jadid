<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>سایه و سکوت | فضای مونوکروم</title>

  <!-- فونت استاندارد و خوانای وزیرمتن برای متون فارسی و انگلیسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;600;800&display=swap" rel="stylesheet" />

  <!-- تیلویند برای چیدمان ریسپانسیو و مدرن -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
       ۱. متغیرها و پالت رنگی کاملاً مونوکروم (سیاه، سفید و طیف خاکستری)
       ========================================================================== */
    :root {
      --void-black: #040404;
      --deep-charcoal: #0b0b0b;
      --ash-gray: #1c1c1c;
      --smoke-gray: #3a3a3a;
      --fog-silver: #8c8c8c;
      --pale-mist: #d4d4d4;
      --stark-white: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--void-black);
      color: var(--stark-white);
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* ==========================================================================
       ۲. بافت نویز سینمایی و سایه‌روشن اطراف صفحه (Vignette & Film Grain)
       ========================================================================== */
    .cinema-grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.045;
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 0);
      background-size: 24px 24px;
      animation: grainShift 8s steps(10) infinite;
      will-change: transform;
    }

    @keyframes grainShift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-2%, -3%, 0); }
      40% { transform: translate3d(3%, -1%, 0); }
      60% { transform: translate3d(-1%, 3%, 0); }
      80% { transform: translate3d(2%, 2%, 0); }
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 35;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(4, 4, 4, 0.05) 0%,
        rgba(4, 4, 4, 0.55) 60%,
        rgba(0, 0, 0, 0.94) 100%
      );
      animation: slowBreathing 16s ease-in-out infinite;
    }

    @keyframes slowBreathing {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; }
    }

    /* ==========================================================================
       ۳. لایه مه متحرک اسلوموشن در پس‌زمینه (Volumetric Fog Layers)
       ========================================================================== */
    .fog-layer {
      position: fixed;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      pointer-events: none;
      will-change: transform;
    }

    .fog-back {
      z-index: 2;
      opacity: 0.22;
      background:
        radial-gradient(ellipse 45% 35% at 25% 30%, rgba(160, 160, 160, 0.18), transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 70%, rgba(110, 110, 110, 0.16), transparent 70%);
      animation: fogDriftSlow 48s ease-in-out infinite alternate;
    }

    .fog-front {
      z-index: 22;
      opacity: 0.16;
      background:
        radial-gradient(ellipse 40% 30% at 70% 25%, rgba(220, 220, 220, 0.12), transparent 65%),
        radial-gradient(ellipse 45% 35% at 30% 80%, rgba(140, 140, 140, 0.14), transparent 70%);
      animation: fogDriftReverse 38s ease-in-out infinite alternate;
    }

    @keyframes fogDriftSlow {
      0% { transform: translate3d(-6%, -2%, 0) scale(1); }
      100% { transform: translate3d(6%, 3%, 0) scale(1.06); }
    }

    @keyframes fogDriftReverse {
      0% { transform: translate3d(5%, 2%, 0) scale(1.04); }
      100% { transform: translate3d(-5%, -3%, 0) scale(0.98); }
    }

    /* ==========================================================================
       ۴. انیمیشن‌های اسلوموشن، شناور بودن و سوسو زدن اشباح برای SVG ها
       ========================================================================== */
    .parallax-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .floating-artifact {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity, filter;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.85));
    }

    /* حرکت اسلوموشن اول: شناوری عمیق و چرخش بسیار نرم */
    @keyframes floatSlowMotionA {
      0% {
        transform: translate3d(0px, 0px, 0) rotate(-3deg) scale(1);
      }
      33% {
        transform: translate3d(14px, -24px, 0) rotate(2deg) scale(1.03);
      }
      66% {
        transform: translate3d(-12px, -10px, 0) rotate(-1.5deg) scale(0.98);
      }
      100% {
        transform: translate3d(0px, 0px, 0) rotate(-3deg) scale(1);
      }
    }

    /* حرکت اسلوموشن دوم: معلق ماندن پاندولی */
    @keyframes floatSlowMotionB {
      0% {
        transform: translate3d(0px, 0px, 0) rotate(4deg) scale(0.98);
      }
      50% {
        transform: translate3d(-18px, -28px, 0) rotate(-4deg) scale(1.04);
      }
      100% {
        transform: translate3d(0px, 0px, 0) rotate(4deg) scale(0.98);
      }
    }

    /* حرکت اسلوموشن سوم: سقوط و صعود آرام مانند غرق شدن در آب */
    @keyframes floatSlowMotionC {
      0% {
        transform: translate3d(0px, -12px, 0) rotate(-2deg);
      }
      50% {
        transform: translate3d(16px, 20px, 0) rotate(3.5deg);
      }
      100% {
        transform: translate3d(0px, -12px, 0) rotate(-2deg);
      }
    }

    /* افکت سوسو زدن روانی و محو شدن در مه */
    @keyframes eerieGhostFlicker {
      0%, 100% { opacity: 0.72; }
      46% { opacity: 0.78; }
      48% { opacity: 0.22; }
      50% { opacity: 0.82; }
      52% { opacity: 0.35; }
      54% { opacity: 0.75; }
      85% { opacity: 0.62; }
    }

    /* انیمیشن اشک یا قطره شمع در داخل SVG */
    @keyframes slowTearDrop {
      0% {
        transform: translateY(0px) scaleY(0.8);
        opacity: 0;
      }
      25% {
        opacity: 0.9;
      }
      85% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(28px) scaleY(1.25);
        opacity: 0;
      }
    }

    /* لرزش خفیف عقربه ساعت شکسته */
    @keyframes brokenClockTick {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(6deg); }
      15% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
      55% { transform: rotate(-4deg); }
    }

    .anim-float-a { animation: floatSlowMotionA 26s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .anim-float-b { animation: floatSlowMotionB 32s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .anim-float-c { animation: floatSlowMotionC 29s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .anim-flicker { animation: eerieGhostFlicker 14s ease-in-out infinite; }
    .anim-tear { animation: slowTearDrop 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .anim-tick {
      transform-origin: 50px 50px;
      animation: brokenClockTick 9s ease-in-out infinite;
    }

    /* ==========================================================================
       ۵. کانتینر متن مرکزی کاملاً ثابت (بدون کوچک‌ترین حرکت یا لرزش)
       ========================================================================== */
    .stationary-center-stage {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 4vw, 3rem);
      pointer-events: none;
    }

    .stationary-text-sanctuary {
      position: relative;
      width: 100%;
      max-width: 44rem;
      text-align: center;
      pointer-events: auto;
      user-select: text;
      /* هاله تاریک نرم پشت متن برای خوانایی مطلق روی المان‌های شناور */
      background: radial-gradient(
        ellipse at center,
        rgba(4, 4, 4, 0.88) 0%,
        rgba(4, 4, 4, 0.58) 58%,
        rgba(4, 4, 4, 0) 100%
      );
      padding: clamp(1.5rem, 4vw, 3rem);
      border-radius: 1.5rem;
      /* تضمین صفر بودن هرگونه انتقال یا حرکت */
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }

    .stationary-text-sanctuary h1,
    .stationary-text-sanctuary p,
    .stationary-text-sanctuary .custom-user-content {
      color: var(--stark-white);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 1);
      line-height: 1.9;
      letter-spacing: -0.01em;
    }

    /* بهینه‌سازی برای کاربرانی که کاهش حرکت را در سیستم فعال کرده‌اند */
    @media (prefers-reduced-motion: reduce) {
      .floating-artifact,
      .fog-layer,
      .cinema-grain,
      .vignette-overlay,
      .anim-tear,
      .anim-tick {
        animation: none !important;
      }
      .parallax-layer {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       اسکریپت بهینه‌سازی‌شده برای ذرات خاکستر معلق و پارالاکس نرم
       ======================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ----------------------------------------------------------------------
         ۱. سیستم ذرات خاکستر و غبار در حال سقوط/صعود اسلوموشن روی Canvas
         ---------------------------------------------------------------------- */
      const canvas = document.getElementById('ashCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let width = 0;
      let height = 0;
      let particles = [];
      let animationFrameId = null;

      // تنظیم تعداد ذرات بر اساس ابعاد صفحه برای حفظ ۶۰ فریم بر ثانیه در موبایل و دسکتاپ
      function getOptimalParticleCount() {
        const area = window.innerWidth * window.innerHeight;
        return Math.min(95, Math.max(35, Math.floor(area / 18000)));
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      class AshParticle {
        constructor(initial) {
          this.reset(initial);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : (Math.random() > 0.3 ? -10 : height + 10);
          this.radius = Math.random() * 2.1 + 0.5;
          // سرعت بسیار آهسته (اسلوموشن)
          this.vy = (Math.random() * 0.28 + 0.08) * (Math.random() > 0.25 ? 1 : -0.6);
          this.vx = (Math.random() - 0.5) * 0.22;
          this.wobbleSpeed = Math.random() * 0.012 + 0.004;
          this.wobblePhase = Math.random() * Math.PI * 2;
          // طیف خاکستری و سفید محو
          const shade = Math.floor(Math.random() * 140 + 100);
          const alpha = Math.random() * 0.42 + 0.08;
          this.color = `rgba(${shade}, ${shade}, ${shade}, ${alpha})`;
        }

        update() {
          this.wobblePhase += this.wobbleSpeed;
          this.x += this.vx + Math.sin(this.wobblePhase) * 0.18;
          this.y += this.vy;

          if (this.y > height + 15 || this.y < -15 || this.x > width + 15 || this.x < -15) {
            this.reset(false);
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
      }

      function initParticles() {
        resizeCanvas();
        const count = getOptimalParticleCount();
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new AshParticle(true));
        }
      }

      function renderLoop() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        animationFrameId = requestAnimationFrame(renderLoop);
      }

      /* ----------------------------------------------------------------------
         ۲. پارالاکس بسیار نرم و اسلوموشن با حرکت ماوس یا لمس صفحه
         (متن مرکزی هرگز تحت تأثیر این حرکت قرار نمی‌گیرد)
         ---------------------------------------------------------------------- */
      const parallaxLayers = document.querySelectorAll('.parallax-layer');
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      function handlePointerMove(clientX, clientY) {
        const halfW = window.innerWidth / 2;
        const halfH = window.innerHeight / 2;
        targetX = (clientX - halfW) / halfW;
        targetY = (clientY - halfH) / halfH;
      }

      window.addEventListener('mousemove', (e) => {
        handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      function updateParallax() {
        // درون‌یابی خطی بسیار کند برای حس اسلوموشن سنگین
        currentX += (targetX - currentX) * 0.03;
        currentY += (targetY - currentY) * 0.03;

        for (let i = 0; i < parallaxLayers.length; i++) {
          const depth = parseFloat(parallaxLayers[i].getAttribute('data-depth')) || 0.05;
          const moveX = -currentX * depth * 320;
          const moveY = -currentY * depth * 320;
          parallaxLayers[i].style.transform = `translate3d(${moveX.toFixed(2)}px, ${moveY.toFixed(2)}px, 0)`;
        }

        requestAnimationFrame(updateParallax);
      }

      /* ----------------------------------------------------------------------
         ۳. مدیریت تغییر سایز صفحه و صرفه‌جویی در باتری هنگام مخفی بودن تب
         ---------------------------------------------------------------------- */
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(initParticles, 200);
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        } else {
          renderLoop();
        }
      });

      window.addEventListener('load', () => {
        initParticles();
        renderLoop();
        updateParallax();
      });
    })();
  </script>
</body>
